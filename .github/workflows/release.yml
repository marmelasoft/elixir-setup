name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    name: Move the major version tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      # Publishing v1.4.2 points v1 at it, so `@v1` users get the release.
      - name: Point the major tag at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag $TAG is not like v1.2.3."
            exit 1
          fi

          major="${TAG%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
