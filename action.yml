name: Setup Elixir Project
description: Installs Erlang and Elixir, fetches and compiles dependencies, and caches the build between runs.

branding:
  icon: "droplet"
  color: "purple"

inputs:
  otp-version:
    description: >-
      Erlang/OTP version to install. Leave it and `elixir-version` empty to
      read both from a version file.
    required: false
    default: ""
  elixir-version:
    description: >-
      Elixir version to install. Leave it and `otp-version` empty to read both
      from a version file.
    required: false
    default: ""
  version-file:
    description: >-
      File to read the versions from: `.tool-versions` (asdf) or `mise.toml`
      (mise). When it is empty and no versions are given, the action looks for
      `.tool-versions`, then `mise.toml`.
    required: false
    default: ""
  version-type:
    description: >-
      `strict` takes versions as written. `loose` picks the latest version that
      matches. Defaults to `loose`, and is always `strict` with a version file.
    required: false
    default: ""
  mix-env:
    description: >-
      Mix environment to compile and cache. Defaults to the `MIX_ENV` the
      workflow sets, or `test`. The rest of the job gets it as `MIX_ENV`.
    required: false
    default: ""
  build-deps:
    description: Compile the dependencies.
    required: false
    default: "true"
  build-app:
    description: Compile the application.
    required: false
    default: "true"
  build-flags:
    description: Flags for `mix compile`.
    required: false
    default: "--all-warnings --warnings-as-errors"
  install-hex:
    description: Install Hex.
    required: false
    default: "true"
  install-rebar:
    description: Install Rebar.
    required: false
    default: "true"
  cache-plts:
    description: >-
      Build and cache the Dialyzer PLTs. Point `plt_core_path` and
      `plt_local_path` in your Dialyzer config at `plts-path`.
    required: false
    default: "false"
  plts-path:
    description: Folder that holds the Dialyzer PLTs.
    required: false
    default: "priv/plts"
  cache-key:
    description: Change it to start every cache from scratch.
    required: false
    default: "v1"
  pre-deps-hook:
    description: >-
      Shell command to run before fetching the dependencies, such as adding a
      private Hex repository.
    required: false
    default: ""

outputs:
  otp-version:
    description: Exact Erlang/OTP version installed.
    value: ${{ steps.beam.outputs.otp-version }}
  elixir-version:
    description: Exact Elixir version installed.
    value: ${{ steps.beam.outputs.elixir-version }}
  mix-env:
    description: Mix environment the action compiled and cached.
    value: ${{ steps.config.outputs.mix-env }}
  build-cache-hit:
    description: "`true` when the cache of `deps/` and `_build/` matched this commit exactly."
    value: ${{ steps.build-cache.outputs.cache-hit }}
  plt-cache-hit:
    description: "`true` when the PLT cache matched `mix.lock` exactly."
    value: ${{ steps.plt-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Pick versions and Mix environment
      id: config
      shell: bash
      env:
        OTP_VERSION: ${{ inputs.otp-version }}
        ELIXIR_VERSION: ${{ inputs.elixir-version }}
        VERSION_FILE: ${{ inputs.version-file }}
        VERSION_TYPE: ${{ inputs.version-type }}
        MIX_ENV_INPUT: ${{ inputs.mix-env }}
      run: |
        if [[ -z "$VERSION_FILE" && -z "$OTP_VERSION" && -z "$ELIXIR_VERSION" ]]; then
          for file in .tool-versions mise.toml; do
            if [[ -f "$file" ]]; then
              VERSION_FILE=$file
              break
            fi
          done

          if [[ -z "$VERSION_FILE" ]]; then
            echo "::error::Set otp-version and elixir-version, or add a .tool-versions or mise.toml file."
            exit 1
          fi
        fi

        # setup-beam refuses a version file unless the versions are strict.
        if [[ -n "$VERSION_FILE" ]]; then
          VERSION_TYPE=strict
        fi

        mix_env="${MIX_ENV_INPUT:-${MIX_ENV:-test}}"
        echo "MIX_ENV=$mix_env" >> "$GITHUB_ENV"

        {
          echo "version-file=$VERSION_FILE"
          echo "version-type=${VERSION_TYPE:-loose}"
          echo "mix-env=$mix_env"
        } >> "$GITHUB_OUTPUT"

    - name: Install Erlang and Elixir
      id: beam
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}
        version-file: ${{ steps.config.outputs.version-file }}
        version-type: ${{ steps.config.outputs.version-type }}
        install-hex: ${{ inputs.install-hex }}
        install-rebar: ${{ inputs.install-rebar }}

    - name: Run pre-deps hook
      if: inputs.pre-deps-hook != ''
      shell: bash
      env:
        PRE_DEPS_HOOK: ${{ inputs.pre-deps-hook }}
      run: eval "$PRE_DEPS_HOOK"

    - name: Build cache keys
      id: keys
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
        OTP_VERSION: ${{ steps.beam.outputs.otp-version }}
        ELIXIR_VERSION: ${{ steps.beam.outputs.elixir-version }}
        MIX_ENV: ${{ steps.config.outputs.mix-env }}
        LOCK_HASH: ${{ hashFiles('mix.lock') }}
      run: |
        runner="${RUNNER_OS}-${RUNNER_ARCH}"
        beam="otp-${OTP_VERSION}-elixir-${ELIXIR_VERSION}-${MIX_ENV}"
        {
          echo "lock=${LOCK_HASH:-no-lock}"
          echo "build=build-${CACHE_KEY}-${runner}-${beam}"
          echo "plt=plt-${CACHE_KEY}-${runner}-${beam}"
        } >> "$GITHUB_OUTPUT"

    # deps/ and _build/ share one cache, because each needs the other:
    # _build/ links to each dependency's priv/ in deps/, and compiling writes
    # into deps/ (NIFs like picosat, rebar3 state, lexers made from .xrl).
    # Cached apart, a restored _build/ can claim a NIF is built while deps/
    # has none.
    #
    # The key ends with the commit, so each new commit saves a fresh build and
    # the next run only compiles what changed since. It falls back to the
    # latest build for the same mix.lock, then to any build.
    - name: Restore build cache
      id: build-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          deps
          _build/${{ steps.config.outputs.mix-env }}
        key: ${{ steps.keys.outputs.build }}-${{ steps.keys.outputs.lock }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.keys.outputs.build }}-${{ steps.keys.outputs.lock }}-
          ${{ steps.keys.outputs.build }}-

    # A build saved with the same mix.lock already has every dependency.
    - name: Fetch dependencies
      if: ${{ !startsWith(steps.build-cache.outputs.cache-matched-key, format('{0}-{1}-', steps.keys.outputs.build, steps.keys.outputs.lock)) }}
      shell: bash
      env:
        MIX_ENV: ${{ steps.config.outputs.mix-env }}
      run: mix deps.get

    # `mix deps.compile` rebuilds every dependency, even when all of them are
    # compiled. `mix loadpaths` only compiles the missing ones:
    # https://elixirforum.com/t/github-action-cache-elixir-always-recompiles-dependencies-elixir-1-13-3/45994/12
    - name: Compile dependencies
      if: inputs.build-deps == 'true'
      shell: bash
      env:
        MIX_ENV: ${{ steps.config.outputs.mix-env }}
      run: mix loadpaths

    - name: Compile application
      if: inputs.build-app == 'true'
      shell: bash
      env:
        MIX_ENV: ${{ steps.config.outputs.mix-env }}
        BUILD_FLAGS: ${{ inputs.build-flags }}
      run: mix compile $BUILD_FLAGS

    # Saved now, before the tests run, so a failed test still keeps the build.
    - name: Save build cache
      if: steps.build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          deps
          _build/${{ steps.config.outputs.mix-env }}
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    # PLTs only depend on the dependencies, and Dialyzer brings an old PLT up
    # to date, so any PLT for the same Erlang and Elixir is a good start.
    - name: Restore PLT cache
      id: plt-cache
      if: inputs.cache-plts == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.plts-path }}
        key: ${{ steps.keys.outputs.plt }}-${{ steps.keys.outputs.lock }}
        restore-keys: ${{ steps.keys.outputs.plt }}-

    # A retried job rebuilds the PLTs, in case a broken one made it fail.
    - name: Build PLTs
      if: inputs.cache-plts == 'true' && (steps.plt-cache.outputs.cache-hit != 'true' || github.run_attempt != '1')
      shell: bash
      env:
        MIX_ENV: ${{ steps.config.outputs.mix-env }}
      run: mix dialyzer --plt

    # Saved now, so Dialyzer warnings later in the job don't lose the PLTs.
    - name: Save PLT cache
      if: inputs.cache-plts == 'true' && steps.plt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.plts-path }}
        key: ${{ steps.plt-cache.outputs.cache-primary-key }}
